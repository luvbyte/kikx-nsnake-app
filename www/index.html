<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Neon Snake</title>
    <link rel="stylesheet" href="style.css" />
    <script src="kikx-sdk.umd.js"></script>
  </head>

  <body>
    <div class="wrap">
      <header class="hud">
        <span class="brand">Neon Snake</span>

        <div class="scores">
          <span class="score"> Score <b id="score">0</b> </span>

          <span class="score"> Best <b id="best">0</b> </span>
        </div>
      </header>

      <div class="stage">
        <canvas
          id="board"
          width="480"
          height="480"
          aria-label="Neon Snake game board"
        ></canvas>

        <div class="overlay" id="overlay">
          <div class="panel">
            <h1 id="title">Neon Snake</h1>

            <p id="msg">
              Arrow keys, or swipe to move. Eat the dots, avoid eating yourself
              :)
            </p>

            <button id="startBtn" class="btn" type="button">Play</button>
          </div>
        </div>
      </div>

      <!-- Mobile D-Pad -->
      <div id="dpad" class="dpad">
        <div class="dpad-row">
          <button class="dpad-btn" data-direction="up" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 1024 1024"
            >
              <path d="M0 0h1024v1024H0z" fill="none" />
              <path
                fill="currentColor"
                d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35"
              />
            </svg>
          </button>
        </div>
        <div class="dpad-row">
          <button class="dpad-btn" data-direction="left" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 1024 1024"
            >
              <path d="M0 0h1024v1024H0z" fill="none" />
              <path
                fill="currentColor"
                d="M689 165.1L308.2 493.5c-10.9 9.4-10.9 27.5 0 37L689 858.9c14.2 12.2 35 1.2 35-18.5V183.6c0-19.7-20.8-30.7-35-18.5"
              />
            </svg>
          </button>
          <button class="dpad-btn" data-direction="down" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 1024 1024"
            >
              <path d="M0 0h1024v1024H0z" fill="none" />
              <path
                fill="currentColor"
                d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35"
              />
            </svg>
          </button>
          <button class="dpad-btn" data-direction="right" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 1024 1024"
            >
              <path d="M0 0h1024v1024H0z" fill="none" />
              <path
                fill="currentColor"
                d="M715.8 493.5L335 165.1c-14.2-12.2-35-1.2-35 18.5v656.8c0 19.7 20.8 30.7 35 18.5l380.8-328.4c10.9-9.4 10.9-27.6 0-37"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
